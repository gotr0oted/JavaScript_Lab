<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 7 | To-do List</title>
    <style>
        :root { --ink:#17233d; --muted:#68758e; --line:#e1e7f2; --purple:#6253d8; --red:#cf4d4d; }
        * { box-sizing:border-box; }
        body { margin:0; padding:40px 18px; background:#f4f6fb; color:var(--ink); font:15px/1.5 Arial,sans-serif; }
        main { width:min(720px,100%); margin:auto; }
        .eyebrow { color:var(--purple); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
        h1 { margin:6px 0 4px; font-size:clamp(26px,5vw,38px); }
        .intro { margin:0 0 24px; color:var(--muted); }
        .card { padding:24px; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 14px 36px #27365b12; }
        form { display:grid; grid-template-columns:1fr auto; gap:10px; }
        input { min-width:0; padding:12px 13px; border:1px solid var(--line); border-radius:10px; font:inherit; }
        input:focus { outline:3px solid #6253d822; border-color:var(--purple); }
        button { border:0; border-radius:9px; padding:10px 14px; font:700 14px Arial,sans-serif; cursor:pointer; }
        .add { background:var(--purple); color:white; }
        .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        .task-list { display:grid; gap:10px; padding:0; margin:20px 0 0; list-style:none; }
        .task { display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line); border-radius:12px; }
        .number { display:grid; place-items:center; width:28px; height:28px; flex:none; border-radius:50%; background:#efedff; color:var(--purple); font-weight:700; }
        .task-text { flex:1; min-width:0; overflow-wrap:anywhere; }
        .edit { background:#efedff; color:var(--purple); }
        .delete { background:#fff0ef; color:var(--red); }
        .summary { margin:16px 0 0; padding:12px 14px; border-radius:10px; background:#eaf8f1; color:#08704b; font-weight:700; }
        @media(max-width:520px) { body{padding:24px 12px}.card{padding:18px}.task{flex-wrap:wrap}.task-text{min-width:calc(100% - 42px)} }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">Experiment 07 · DOM Traversal</div>
    <h1>My To-do List</h1>
    <p class="intro">Add, edit, and remove tasks using DOM traversal and event handling.</p>
    <section class="card" aria-label="To-do list">
        <form id="taskForm">
            <label class="visually-hidden" for="taskInput">New task</label>
            <input id="taskInput" type="text" placeholder="Write a task and press Add" maxlength="120" required>
            <button class="add" type="submit">Add task</button>
        </form>
        <ul class="task-list" id="taskList" aria-live="polite"></ul>
        <p class="summary" id="taskSummary" role="status"></p>
    </section>
</main>
<script>
    const taskList = document.getElementById("taskList");
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const starterTasks = ["Review JavaScript arrays", "Complete practical record", "Practice DOM events"];

    function addTask(text) {
        const item = document.createElement("li");
        item.className = "task";
        item.innerHTML = '<span class="number"></span><span class="task-text"></span><button class="edit" type="button" data-action="edit">Edit</button><button class="delete" type="button" data-action="delete">Delete</button>';
        item.querySelector(".task-text").textContent = text;
        taskList.append(item);
        Array.from(taskList.children).forEach((task, index) => {
            task.querySelector(".number").textContent = String(index + 1);
        });
        document.getElementById("taskSummary").textContent = `${taskList.children.length} task${taskList.children.length === 1 ? "" : "s"} in your list`;
    }

    taskForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const task = taskInput.value.trim();
        if (!task) return;
        addTask(task);
        taskInput.value = "";
        taskInput.focus();
    });

    taskList.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const item = button.closest("li");
        if (button.dataset.action === "delete") item.remove();
        if (button.dataset.action === "edit") {
            const current = item.querySelector(".task-text").textContent;
            const updated = window.prompt("Edit task", current);
            if (updated !== null && updated.trim()) item.querySelector(".task-text").textContent = updated.trim();
        }
        Array.from(taskList.children).forEach((task, index) => {
            task.querySelector(".number").textContent = String(index + 1);
        });
        document.getElementById("taskSummary").textContent = `${taskList.children.length} task${taskList.children.length === 1 ? "" : "s"} in your list`;
    });

    starterTasks.forEach(addTask);
</script>
</body>
</html>
