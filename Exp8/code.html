<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 8 | Gym Admission Form</title>
    <style>
        :root { --ink:#17233d; --muted:#68758e; --line:#e1e7f2; --purple:#6253d8; --green:#08704b; --red:#b42318; }
        * { box-sizing:border-box; }
        body { margin:0; padding:40px 18px; background:#f4f6fb; color:var(--ink); font:15px/1.5 Arial,sans-serif; }
        main { width:min(760px,100%); margin:auto; }
        .eyebrow { color:var(--purple); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
        h1 { margin:6px 0 4px; font-size:clamp(26px,5vw,38px); }
        .intro { margin:0 0 24px; color:var(--muted); }
        .card { padding:24px; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 14px 36px #27365b12; }
        .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
        .field.full { grid-column:1/-1; }
        label { display:block; margin:0 0 6px; font-weight:700; }
        input,select { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:white; font:inherit; }
        input:focus,select:focus { outline:3px solid #6253d822; border-color:var(--purple); }
        .hint { min-height:18px; margin:4px 0 0; color:var(--muted); font-size:12px; }
        .hint.invalid { color:var(--red); }
        .hint.valid { color:var(--green); }
        button { margin-top:18px; border:0; border-radius:10px; padding:12px 18px; background:var(--purple); color:white; font:700 15px Arial,sans-serif; cursor:pointer; }
        .result { margin:16px 0 0; padding:12px 14px; border-radius:10px; background:#eaf8f1; color:var(--green); font-weight:700; }
        .result.error { background:#fff0ef; color:var(--red); }
        @media(max-width:560px) { body{padding:24px 12px}.card{padding:18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}button{width:100%} }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">Experiment 08 · Form Events</div>
    <h1>Gym Admission Form</h1>
    <p class="intro">Enter member details and see the fields validate as you type.</p>
    <section class="card">
        <form id="admissionForm" novalidate>
            <div class="grid">
                <div class="field full"><label for="fullName">Full name</label><input id="fullName" name="fullName" value="Parth Pusadkar" autocomplete="name" required><p class="hint" id="fullNameHint"></p></div>
                <div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="16" max="70" value="20" required><p class="hint" id="ageHint"></p></div>
                <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="parth.pusadkar@example.com" autocomplete="email" required><p class="hint" id="emailHint"></p></div>
                <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" value="9876543210" autocomplete="tel" required><p class="hint" id="phoneHint"></p></div>
                <div class="field"><label for="membership">Membership</label><select id="membership" name="membership"><option>Monthly</option><option selected>Quarterly</option><option>Yearly</option></select><p class="hint" id="membershipHint"></p></div>
            </div>
            <button type="submit">Validate admission</button>
            <p class="result" id="formResult" role="status" aria-live="polite">Complete the form to validate your details.</p>
        </form>
    </section>
</main>
<script>
    const fields = ["fullName", "age", "email", "phone"];

    function validateField(id) {
        const input = document.getElementById(id);
        const hint = document.getElementById(`${id}Hint`);
        let message = "Valid";
        let valid = true;
        if (id === "fullName") valid = input.value.trim().length >= 2, message = valid ? "Valid name" : "Enter your full name";
        if (id === "age") valid = Number(input.value) >= 16 && Number(input.value) <= 70, message = valid ? "Valid age" : "Age must be from 16 to 70";
        if (id === "email") valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim()), message = valid ? "Valid email" : "Enter a valid email address";
        if (id === "phone") valid = /^\+?[0-9\s()-]{10,16}$/.test(input.value.trim()) && input.value.replace(/\D/g, "").length >= 10, message = valid ? "Valid phone number" : "Enter at least 10 digits";
        input.setAttribute("aria-invalid", String(!valid));
        hint.textContent = message;
        hint.className = `hint ${valid ? "valid" : "invalid"}`;
        return valid;
    }

    fields.forEach((id) => {
        const input = document.getElementById(id);
        input.addEventListener("input", () => validateField(id));
        input.addEventListener("blur", () => validateField(id));
    });
    document.getElementById("membership").addEventListener("change", (event) => {
        document.getElementById("membershipHint").textContent = `${event.target.value} membership selected`;
        document.getElementById("membershipHint").className = "hint valid";
    });
    document.getElementById("admissionForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const valid = fields.map(validateField).every(Boolean);
        const result = document.getElementById("formResult");
        result.classList.toggle("error", !valid);
        result.textContent = valid ? `Form is valid and ready to submit. ${document.getElementById("membership").value} membership selected.` : "Please correct the highlighted fields and try again.";
    });
    fields.forEach(validateField);
</script>
</body>
</html>
